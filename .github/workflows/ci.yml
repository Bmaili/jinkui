# 每次推送和 PR：单元测试 + 类型检查。安卓打包、发布等安卓工程建好后再加。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: 安装 age（验证和命令行互通）
        run: sudo apt-get update -q && sudo apt-get install -y -q age

      - name: 安装依赖
        run: npm ci

      - name: 单元测试
        run: npm test

      - name: 类型检查
        run: npm run typecheck
